name: Shell Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions: read-all

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install shellcheck
        uses: nick-fields/retry@v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 10
          command: |
            sudo apt-get update
            sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          find . -name '*.sh' -type f \
            -not -path './venv/*' \
            -not -path './generated-networkpolicies/*' \
            -not -path './complianceremediations/*' \
            -not -path './test-runs/*' \
            -not -path './testing/*' \
            -not -path './docs/vendor/*' \
            -print0 | xargs -0 shellcheck

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install shfmt
        run: |
          SHFMT_VERSION=3.10.0
          wget -qO /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
      - name: Run shfmt
        run: shfmt -d lib core utilities modular lab-tools misc scripts tests

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.12
          wget -qO- "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
      - name: Install shellcheck
        uses: nick-fields/retry@v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 10
          command: |
            sudo apt-get update
            sudo apt-get install -y shellcheck
      - name: Run actionlint
        run: |
          SHELLCHECK_OPTS="-e $(sed -n 's/^disable=//p' .shellcheckrc)" actionlint -color
