name: Update Marketplace Versions

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update-marketplace-versions:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'sebrandon1' && github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Run update script
        id: update
        run: |
          OUTPUT=$(./scripts/update-marketplace-versions.sh 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "updated=true"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="automated/update-marketplace-versions"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING" ]]; then
            echo "PR #${EXISTING} already open — skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add utilities/verify-images.sh
          git commit -m "Update community-operator-index versions"
          git push -f origin "$BRANCH"

          gh pr create \
            --title "Update community-operator-index versions" \
            --body "Automated PR to update the marketplace image verification list with the latest available OCP versions." \
            --base main \
            --head "$BRANCH"

  notify-failure:
    needs: [update-marketplace-versions]
    if: always() && needs.update-marketplace-versions.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="CI: Update Marketplace Versions workflow failed"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-failure --state open --search "$TITLE" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Workflow failed again on $(date -u +%Y-%m-%dT%H:%M:%SZ). [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --label ci-failure \
              --body "The scheduled **Update Marketplace Versions** workflow failed.

          **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
