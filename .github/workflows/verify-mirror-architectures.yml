name: Verify Mirror Architectures

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC (after mirror workflow at 4 AM)
  workflow_dispatch:

permissions: read-all

env:
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'quay.io/bapalm' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'sebrandon1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install skopeo
        uses: nick-fields/retry@v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 5
          retry_wait_seconds: 10
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq skopeo

      - name: Detect latest CO release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CO_REF=$(./scripts/detect-co-release.sh)
          echo "Detected CO release: $CO_REF"
          echo "co_ref=$CO_REF" >> "$GITHUB_OUTPUT"

      - name: Load pinned image versions
        id: pins
        run: |
          set -a
          source versions.env
          set +a
          echo "co_image_tag=${CO_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "content_image_tag=${CONTENT_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Pinned versions: co=${CO_IMAGE_TAG} content=${CONTENT_IMAGE_TAG}"

      - name: Verify mirror image architectures
        run: |
          CO_REF="${{ steps.detect.outputs.co_ref }}"
          CO_IMAGE_TAG="${{ steps.pins.outputs.co_image_tag }}"
          CONTENT_IMAGE_TAG="${{ steps.pins.outputs.content_image_tag }}"
          ./utilities/verify-mirror-architectures.sh \
            "${IMAGE_REGISTRY}/compliance-operator:${CO_REF}" \
            "${IMAGE_REGISTRY}/openscap-ocp:${CO_REF}" \
            "${IMAGE_REGISTRY}/compliance-operator-bundle:${CO_REF}" \
            "${IMAGE_REGISTRY}/compliance-operator-catalog:${CO_REF}" \
            "${IMAGE_REGISTRY}/compliance-operator:${CO_IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/openscap-ocp:${CO_IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/compliance-operator-bundle:${CO_IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/compliance-operator-catalog:${CO_IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/k8scontent:${CONTENT_IMAGE_TAG}" \
            "${IMAGE_REGISTRY}/k8scontent:latest"
